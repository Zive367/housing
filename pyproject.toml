[project]
name = "housing-bot"
version = "0.1.0"
description = "24/7 rental-listing watcher, scam filter and auto-applier for the Den Haag region"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "gspread>=6.1",
    "google-auth>=2.29",
    "phonenumbers>=8.13",
    "playwright==1.56.0",   # must match the browser build in the Docker base image
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
housing-bot = "housing_bot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["housing_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
